name: Deploiement dembs.fr

# Chaque push sur main publie le site sur GitHub Pages, servi sur dembs.fr.
# Le domaine personnalise vient du fichier CNAME, et le certificat HTTPS est
# genere automatiquement par GitHub une fois le DNS en place.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication:
    name: Publication du site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Preparation des fichiers a publier
        run: |
          mkdir -p site
          # tout sauf les fichiers de travail
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude '.gitignore' \
                   --exclude 'README.md' \
                   --exclude 'site' \
                   ./ site/
          echo "Fichiers publies :"
          find site -type f | sort

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploiement
        id: deploiement
        uses: actions/deploy-pages@v4

      - name: Controle du site en ligne
        run: |
          echo "Attente de la propagation, 15 s"
          sleep 15
          for url in https://dembs.fr/ https://dembs.fr/mentions-legales.html; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 "$url" || echo "erreur")
            echo "$url repond : $code"
          done
          echo "Un code autre que 200 est normal tant que le DNS de dembs.fr n'est pas bascule sur GitHub Pages."
